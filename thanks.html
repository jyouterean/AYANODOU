    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa_cream: '#F4F1E9',
                        wa_walnut: '#33261D',
                        wa_moss: '#68784E',
                        wa_gold: '#B59A6D',
                        wa_paper: '#EBE6D8',
                        wa_dark: '#1C1510'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', 'serif'],
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            width: 100%; min-height: 100%;
            background-color: #F4F1E9; color: #33261D;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "palt" 1;
        }
        ::selection { background: #68784E; color: #F4F1E9; }
        ::-webkit-scrollbar { display: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 38, 29, 0.08);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.06);
        }

        .link-underline { position: relative; }
        .link-underline::after {
            content: ''; position: absolute; width: 100%; transform: scaleX(0);
            height: 1px; bottom: -4px; left: 0; background-color: currentColor;
            transform-origin: bottom right; transition: transform 0.4s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .link-underline:hover::after { transform: scaleX(1); transform-origin: bottom left; }

        /* fade-in animation */
        .fade-up {
            opacity: 0; transform: translateY(30px);
            animation: fadeUp 0.8s ease forwards;
        }
        .fade-up-delay { animation-delay: 0.2s; }
        .fade-up-delay-2 { animation-delay: 0.4s; }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* check mark animation */
        .check-circle {
            opacity: 0;
            animation: scaleIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.3s;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.3) rotate(-90deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .check-path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.6s ease forwards;
            animation-delay: 1s;
        }
        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-wa_cream">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 w-full z-50 bg-wa_cream/90 backdrop-blur-md border-b border-wa_walnut/5">

            <a href="index.html" class="flex items-center gap-4 group">
                <div class="w-8 h-8 flex items-center justify-center border border-wa_gold/60 rotate-45 group-hover:rotate-[135deg] transition-transform duration-700">
                    <span class="-rotate-45 font-serif text-wa_gold text-sm group-hover:-rotate-[135deg] transition-transform duration-700">綾</span>
                </div>
                <span class="font-serif text-xl tracking-[0.2em] text-wa_walnut">綾乃堂</span>
                <span class="hidden md:inline text-[0.6rem] text-wa_gold tracking-[0.3em] pl-4 border-l border-wa_walnut/20 uppercase">Thanks</span>
            </a>
            <a href="index.html" class="font-sans text-xs tracking-[0.15em] text-wa_walnut/70 hover:text-wa_walnut transition-colors link-underline">
                <i class="ph ph-arrow-left mr-2"></i>TOP

        </div>
    </header>

    <!-- MAIN -->
    <main class="pt-32 md:pt-40 pb-16 md:pb-32 min-h-screen flex items-center">

            <!-- COMPLETION PANEL -->
            <div class="glass-panel p-10 md:p-20 border-t-4 border-wa_gold text-center fade-up">

                <!-- CHECK ICON -->
                <div class="check-circle inline-flex items-center justify-center w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-wa_gold mb-10">
                    <svg class="w-12 h-12 md:w-14 md:h-14 text-wa_gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline class="check-path" points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>

                <!-- HEADING -->
                <div class="fade-up fade-up-delay">
                    <h1 class="font-serif text-3xl md:text-4xl text-wa_walnut tracking-widest mb-4">送信完了</h1>
                    <span class="font-sans text-wa_gold text-xs tracking-[0.3em] uppercase">Thank You</span>
                </div>

                <!-- MESSAGE -->
                <div class="fade-up fade-up-delay-2 mt-12 space-y-6">
                    <p class="font-sans text-sm md:text-base text-wa_walnut leading-[2.4]">
                        この度はお問い合わせいただき、<br>
                        誠にありがとうございます。
                    </p>
                    <p class="font-sans text-xs md:text-sm text-wa_walnut/60 leading-[2.2] max-w-md mx-auto">
                        担当者が内容を確認の上、<br class="hidden md:inline">
                        通常3営業日以内にご返信いたします。<br>
                        今しばらくお待ちくださいませ。
                    </p>

                    <!-- DIVIDER -->
                    <div class="flex items-center justify-center gap-4 py-6">
                        <span class="w-12 h-px bg-wa_gold/40"></span>
                        <span class="w-1.5 h-1.5 rotate-45 bg-wa_gold/60"></span>
                        <span class="w-12 h-px bg-wa_gold/40"></span>
                    </div>

                    <!-- NOTE -->
                    <p class="font-sans text-[0.7rem] md:text-xs text-wa_walnut/40 leading-[2.0] max-w-md mx-auto">
                        ※自動返信メールが届かない場合は、<br class="hidden md:inline">
                        迷惑メールフォルダをご確認ください。<br>
                        3営業日を過ぎても返信がない場合は、<br class="hidden md:inline">
                        お手数ですが再度ご連絡をお願いいたします。
                    </p>
                </div>

                <!-- BACK BUTTON -->
                <div class="fade-up fade-up-delay-2 mt-12 pt-8 border-t border-wa_walnut/10">
                    <a href="index.html"
                       class="inline-flex items-center gap-3 bg-wa_gold text-wa_walnut px-10 py-4 text-sm font-medium tracking-[0.2em] uppercase hover:bg-wa_cream transition-colors duration-300">
                        <i class="ph ph-house text-lg"></i>
                        トップへ戻る
                    </a>
                </div>

            </div>
        </div>
    </main>
