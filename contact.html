<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 合同会社綾乃堂 - AYANODOU</title>
    <meta name="description" content="合同会社綾乃堂へのお問い合わせはこちら。包装パッケージ事業、サプリメント事業に関するご質問・ご相談を承っております。">

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa_cream: '#F4F1E9',
                        wa_walnut: '#33261D',
                        wa_moss: '#68784E',
                        wa_gold: '#B59A6D',
                        wa_paper: '#EBE6D8',
                        wa_dark: '#1C1510'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', 'serif'],
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            width: 100%; min-height: 100%;
            background-color: #F4F1E9; color: #33261D;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "palt" 1;
        }
        ::selection { background: #68784E; color: #F4F1E9; }
        ::-webkit-scrollbar { display: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 38, 29, 0.08);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.06);
        }

        .link-underline { position: relative; }
        .link-underline::after {
            content: ''; position: absolute; width: 100%; transform: scaleX(0);
            height: 1px; bottom: -4px; left: 0; background-color: currentColor;
            transform-origin: bottom right; transition: transform 0.4s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .link-underline:hover::after { transform: scaleX(1); transform-origin: bottom left; }

        /* fade-in animation */
        .fade-up {
            opacity: 0; transform: translateY(30px);
            animation: fadeUp 0.8s ease forwards;
        }
        .fade-up-delay { animation-delay: 0.2s; }
        .fade-up-delay-2 { animation-delay: 0.4s; }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-wa_cream">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 w-full z-50 bg-wa_cream/90 backdrop-blur-md border-b border-wa_walnut/5">
        <div class="max-w-[1600px] mx-auto px-6 md:px-12 flex items-center justify-between h-16 md:h-20">
            <a href="index.html" class="flex items-center gap-4 group">
                <div class="w-8 h-8 flex items-center justify-center border border-wa_gold/60 rotate-45 group-hover:rotate-[135deg] transition-transform duration-700">
                    <span class="-rotate-45 font-serif text-wa_gold text-sm group-hover:-rotate-[135deg] transition-transform duration-700">綾</span>
                </div>
                <span class="font-serif text-xl tracking-[0.2em] text-wa_walnut">綾乃堂</span>
                <span class="hidden md:inline text-[0.6rem] text-wa_gold tracking-[0.3em] pl-4 border-l border-wa_walnut/20 uppercase">Contact</span>
            </a>
            <a href="index.html" class="font-sans text-xs tracking-[0.15em] text-wa_walnut/70 hover:text-wa_walnut transition-colors link-underline">
                <i class="ph ph-arrow-left mr-2"></i>TOP
            </a>
        </div>
    </header>

    <!-- MAIN -->
    <main class="pt-32 md:pt-40 pb-16 md:pb-32">
        <div class="max-w-[800px] mx-auto px-6 md:px-12">

            <!-- HEADING -->
            <div class="text-center mb-16 fade-up">
                <h1 class="font-serif text-4xl md:text-5xl text-wa_walnut tracking-widest mb-4">お問い合わせ</h1>
                <span class="font-sans text-wa_gold text-xs tracking-[0.3em] uppercase">Contact</span>
                <p class="font-sans text-sm text-wa_walnut/50 mt-8 leading-[2.2] max-w-md mx-auto">
                    ご質問・ご相談がございましたら、<br class="hidden md:inline">下記フォームよりお気軽にお問い合わせください。
                </p>
            </div>

            <!-- FORM -->
            <div class="glass-panel p-8 md:p-16 border-t-4 border-wa_gold fade-up fade-up-delay">

                <form action="#" method="POST" class="font-sans text-sm text-wa_walnut space-y-8">

                    <!-- 姓・名 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">姓 <span class="text-red-400">*</span></label>
                            <input type="text" name="last_name" required
                                   class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut placeholder-wa_walnut/30 focus:outline-none focus:border-wa_gold transition-colors"
                                   placeholder="山田">
                        </div>
                        <div>
                            <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">名 <span class="text-red-400">*</span></label>
                            <input type="text" name="first_name" required
                                   class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut placeholder-wa_walnut/30 focus:outline-none focus:border-wa_gold transition-colors"
                                   placeholder="太郎">
                        </div>
                    </div>

                    <!-- 会社名 -->
                    <div>
                        <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">会社名</label>
                        <input type="text" name="company"
                               class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut placeholder-wa_walnut/30 focus:outline-none focus:border-wa_gold transition-colors"
                               placeholder="株式会社○○">
                    </div>

                    <!-- メールアドレス・電話番号 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">メールアドレス <span class="text-red-400">*</span></label>
                            <input type="email" name="email" required
                                   class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut placeholder-wa_walnut/30 focus:outline-none focus:border-wa_gold transition-colors"
                                   placeholder="example@email.com">
                        </div>
                        <div>
                            <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">電話番号</label>
                            <input type="tel" name="phone"
                                   class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut placeholder-wa_walnut/30 focus:outline-none focus:border-wa_gold transition-colors"
                                   placeholder="03-0000-0000">
                        </div>
                    </div>

                    <!-- 問い合わせの種類 -->
                    <div>
                        <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">問い合わせの種類</label>
                        <select name="inquiry_type"
                                class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut focus:outline-none focus:border-wa_gold transition-colors appearance-none"
                                style="background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 12 12%22%3E%3Cpath d=%22M2 4l4 4 4-4%22 fill=%22none%22 stroke=%22%23B59A6D%22 stroke-width=%221.5%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 1rem center;">
                            <option value="" class="bg-wa_cream">選択してください</option>
                            <option value="packaging" class="bg-wa_cream">包装パッケージ事業</option>
                            <option value="supplement" class="bg-wa_cream">サプリメント事業</option>
                        </select>
                    </div>

                    <!-- 問い合わせ内容 -->
                    <div>
                        <label class="block mb-2 tracking-widest text-wa_gold text-xs font-medium">問い合わせ内容 <span class="text-red-400">*</span></label>
                        <textarea name="message" rows="6" required
                                  class="w-full bg-wa_walnut/5 border border-wa_walnut/15 rounded-none px-4 py-3 text-wa_walnut placeholder-wa_walnut/30 focus:outline-none focus:border-wa_gold transition-colors resize-vertical"
                                  placeholder="お問い合わせ内容をご記入ください"></textarea>
                    </div>

                    <!-- 送信ボタン -->
                    <div class="text-center pt-4">
                        <button type="submit"
                                class="inline-flex items-center gap-3 bg-wa_gold text-wa_walnut px-12 py-4 text-sm font-medium tracking-[0.2em] uppercase hover:bg-wa_cream transition-colors duration-300">
                            <i class="ph ph-paper-plane-tilt text-lg"></i>
                            送信する
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-wa_dark text-wa_cream pt-16 pb-12">
        <div class="max-w-[1600px] mx-auto px-6 md:px-12">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 font-sans text-[0.65rem] text-wa_cream/30 tracking-[0.2em] uppercase">
                <p>&copy; 2024 Ayanodou LLC. All Rights Reserved.</p>
                <div class="flex items-center gap-3">
                    <span>Tokyo</span>
                    <span class="w-[3px] h-[3px] rounded-full bg-wa_gold"></span>
                    <span>Japan</span>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
